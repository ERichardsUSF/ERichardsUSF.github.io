<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Manage Teams | Sideline</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head><body><header class="topbar"><a class="brand" href="index.html"><span class="brand-mark" aria-hidden="true">S</span> Sideline</a><nav class="nav" aria-label="Main navigation"><a href="index.html">Home</a><a href="manage.html" aria-current="page">Manage Teams</a><a href="analytics.html">Analytics</a><a href="aboutus.html">About Us</a></nav></header><main><div class="page-intro"><div class="eyebrow" style="color:#657169">Create · Read · Update · Delete</div><h1>Manage teams</h1><p>Add, edit, search, or remove sports teams. This is a browser-based demonstration; changes are stored on your device.</p></div><section class="panel"><h2 id="form-title">Add a team</h2><form id="team-form"><input id="edit-index" type="hidden"><div class="field-grid"><div class="field"><label for="team-name">Team name</label><input id="team-name" maxlength="70" required placeholder="e.g. Houston Stars"></div><div class="field"><label for="team-city">City / location</label><input id="team-city" maxlength="70" required placeholder="e.g. Houston"></div><div class="field"><label for="team-sport">Sport</label><select id="team-sport"><option>Soccer</option><option>Basketball</option><option>Baseball</option><option>Football</option><option>Other</option></select></div><div class="field"><label for="team-league">League</label><input id="team-league" maxlength="60" required placeholder="e.g. Local League"></div></div><div class="actions"><button class="btn" type="submit" id="save-button">Add team</button><button class="btn secondary" type="button" id="clear-button">Clear form</button></div><p id="status" role="status" aria-live="polite" class="notice"></p></form></section><section class="panel"><h2>The roster</h2><div class="field"><label for="team-filter">Search team records</label><input class="search-input" id="team-filter" type="search" placeholder="Search by name, sport, or city"></div><p id="team-count" class="notice"></p><div class="table-wrap"><table><thead><tr><th>Team</th><th>City</th><th>Sport</th><th>League</th><th>Actions</th></tr></thead><tbody id="team-rows"></tbody></table></div><div class="actions"><button class="btn secondary" type="button" id="reset-data">Restore original teams</button></div></section>
  <footer class="site-footer"><span>SIDELINE · FOR THE LOVE OF THE GAME</span></footer>
</main><script src="teams.js"></script><script>
let records=getTeams();const $=s=>document.querySelector(s);const form=$('#team-form');
function clearForm(){form.reset();$('#edit-index').value='';$('#form-title').textContent='Add a team';$('#save-button').textContent='Add team'}
function render(){const q=$('#team-filter').value.trim().toLowerCase();const found=records.map((team,index)=>({team,index})).filter(({team})=>[team.name,team.city,team.sport,team.league].join(' ').toLowerCase().includes(q));$('#team-count').textContent=found.length+' of '+records.length+' teams';$('#team-rows').innerHTML=found.map(({team,index})=>'<tr><td>'+escapeHTML(team.name)+'</td><td>'+escapeHTML(team.city)+'</td><td>'+escapeHTML(team.sport)+'</td><td>'+escapeHTML(team.league)+'</td><td><button class="small-btn" data-action="edit" data-index="'+index+'">Edit</button><button class="small-btn" data-action="delete" data-index="'+index+'">Delete</button></td></tr>').join('')||'<tr><td colspan="5">No matching teams found.</td></tr>'}
form.addEventListener('submit',e=>{e.preventDefault();const team={name:$('#team-name').value.trim(),city:$('#team-city').value.trim(),sport:$('#team-sport').value,league:$('#team-league').value.trim()};if(!team.name||!team.city||!team.league)return;const edit=$('#edit-index').value;const old=edit!==''?records[Number(edit)]:null;team.mark=old?.mark||team.name.split(/\s+/).map(s=>s[0]).join('').slice(0,3).toUpperCase();team.color=old?.color||'#1d3529';if(edit==='')records.push(team);else records[Number(edit)]=team;saveTeams(records);clearForm();render();$('#status').textContent='Team saved successfully.'});
$('#team-rows').addEventListener('click',e=>{const btn=e.target.closest('button[data-action]');if(!btn)return;const i=Number(btn.dataset.index);if(btn.dataset.action==='edit'){const t=records[i];$('#edit-index').value=i;$('#team-name').value=t.name;$('#team-city').value=t.city;$('#team-sport').value=t.sport;$('#team-league').value=t.league;$('#form-title').textContent='Edit a team';$('#save-button').textContent='Save changes';form.scrollIntoView({behavior:'smooth'});$('#team-name').focus()}else if(confirm('Delete '+records[i].name+'?')){records.splice(i,1);saveTeams(records);clearForm();render();$('#status').textContent='Team deleted.'}});
$('#team-filter').addEventListener('input',render);$('#clear-button').addEventListener('click',clearForm);$('#reset-data').addEventListener('click',()=>{if(confirm('Restore the original sample teams?')){records=DEFAULT_TEAMS.map(t=>({...t}));saveTeams(records);clearForm();render();$('#status').textContent='Original teams restored.'}});render();
</script></body></html>
